# Copy to ~/.config/loaf/config.toml
# Every key here is optional and shows its default; delete any line to accept it.

# Where your notes live. Tilde is expanded. Override at runtime with $LOAF_VAULT,
# which always wins over this.
vault = "~/Notes"

# Points the loaf-notes and loaf-brief skills at this repo's single-source
# TASK-FORMAT.md, so they read the task format instead of restating it. Normally
# set automatically by `scripts/install.sh` to "<your repo>/TASK-FORMAT.md". It's
# an absolute path, so re-run the installer if you move the clone.
# contract = "/absolute/path/to/loaf/TASK-FORMAT.md"

# Built-in themes: frosted, card, console, daylight, nord, sepia, solarized-light,
# solarized-dark. Also switchable live from the menu bar, which rewrites this line.
theme = "frosted"

# What you see when the panel opens: "preview" renders markdown, "source" shows raw text.
start_mode = "preview"

[dates]
# Tasks due within this many days render as "soon" rather than "later".
soon_within_days = 2
# Week start for `every:week` and relative phrases: "monday" or "sunday".
week_starts = "monday"
