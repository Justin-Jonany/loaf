name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  secrets:
    # Server-side backstop for the local pre-commit hook, which can be skipped
    # with --no-verify or simply not installed on someone's machine.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: brew install gitleaks
      - name: Scan for secrets
        run: gitleaks detect --source . --redact --verbose

  test:
    # FoolscapCore is UI-free, so the logic suite runs without a GUI session
    # and without Xcode.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Show toolchain
        run: swift --version
      - name: Build
        run: swift build -v
      - name: Core-boundary check
        run: bash scripts/check-core-boundary.sh
      - name: Self-test
        # Not `swift test`: XCTest ships only with Xcode, so the suite is a plain
        # executable that any Command Line Tools install can run.
        run: swift run foolscap-selftest

  app:
    needs: test
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Assemble Foolscap.app
        run: ./build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Foolscap-app-unsigned
          path: dist/Foolscap.app
